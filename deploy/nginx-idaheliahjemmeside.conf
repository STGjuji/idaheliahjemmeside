# Nginx site config for Ida Helia Photography
# Installed at /etc/nginx/sites-available/idaheliahjemmeside.conf inside the LXC.
#
# NOTE: adjust server_name to your real domain(s). For production TLS, get a
# free cert with: sudo certbot --nginx -d yourdomain.dk -d www.yourdomain.dk

server {
    listen 80;
    listen [::]:80;

    server_name idahelia.dk www.idahelia.dk;

    root /var/www/idaheliahjemmeside;
    index index.html;

    # Hashed, cacheable build assets (immutable)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else falls back to index.html (SPA-safe for future routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Compress text-like assets
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}